<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Testador do Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .btn-signup { background-color: #28a745; }
        .btn-signup:hover { background-color: #218838; }
        textarea { width: 100%; height: 120px; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 Testador Firebase</h2>
    <p>Use este painel para gerar tokens JWT válidos para testar a sua API Spring Boot.</p>

    <label>Email:</label>
    <input type="email" id="email" value="teste@financeapi.com">

    <label>Senha:</label>
    <input type="password" id="password" value="Senha123!">

    <button class="btn-signup" onclick="auth('signUp')">1. Criar Nova Conta</button>
    <button onclick="auth('signInWithPassword')">2. Fazer Login</button>

    <p id="statusMsg"></p>

    <label>Seu Token JWT (Bearer):</label>
    <textarea id="tokenResult" readonly placeholder="O token aparecerá aqui..."></textarea>
    <button onclick="copyToken()" style="background-color: #6c757d;">📋 Copiar Token</button>
</div>

<script>
    // A sua Web API Key
    const API_KEY = "AIzaSyAPuIIeKCBmW0hQtN6Sw7pCxtXXvWgsW2Y";

    async function auth(action) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const statusMsg = document.getElementById('statusMsg');
        const tokenResult = document.getElementById('tokenResult');

        statusMsg.innerHTML = "A processar...";
        statusMsg.className = "";
        tokenResult.value = "";

        const url = `https://identitytoolkit.googleapis.com/v1/accounts:${action}?key=${API_KEY}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, returnSecureToken: true })
            });

            const data = await response.json();

            if (!response.ok) {
                statusMsg.innerHTML = "❌ Erro: " + data.error.message;
                statusMsg.className = "error";
            } else {
                statusMsg.innerHTML = action === 'signUp' ? "✅ Conta criada com sucesso!" : "✅ Login efetuado com sucesso!";
                statusMsg.style.color = "green";
                // Mostra o token na caixa de texto
                tokenResult.value = data.idToken;
            }
        } catch (error) {
            statusMsg.innerHTML = "❌ Erro na requisição: " + error.message;
            statusMsg.className = "error";
        }
    }

    function copyToken() {
        const tokenText = document.getElementById('tokenResult');
        if(tokenText.value) {
            tokenText.select();
            document.execCommand('copy');
            alert("Token copiado para a área de transferência! Cole no Postman como Bearer Token.");
        } else {
            alert("Não há nenhum token para copiar. Faça login primeiro.");
        }
    }
</script>

</body>
</html>
